name: tonicuisc
description: Tonicuisc - 咪咕/酷我 音乐播放器（Windows / Linux / macOS / iOS）
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  just_audio: ^0.9.40
  # 手机端锁屏 / 控制中心控制（仅 Android / iOS 生效）
  just_audio_background: ^0.0.1-beta.11
  # Windows / Linux 上为 just_audio 提供播放后端
  just_audio_media_kit: ^2.0.5
  media_kit_libs_audio: ^1.0.5
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  # 设备 API Key 只存系统安全存储（Keychain / Keystore / DPAPI / libsecret）
  flutter_secure_storage: ^9.2.2
  # 「打开登录页」按钮
  url_launcher: ^6.3.1
  # 前台常亮（iOS 上避免看着看着黑屏）
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
