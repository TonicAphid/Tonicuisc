name: macOS Build

# 单独的 macOS 构建。
#
# 为什么从 build.yml 里拆出来：
#   1. macOS runner 计费是 Linux 的 10 倍，全平台 matrix 跑一次要 40 分钟，
#      改客户端时想只验证 macOS，用这个 workflow_dispatch 手动触发就够了；
#   2. **架构**：GitHub 的 macos-latest 现在是 Apple Silicon（arm64），
#      只出 arm64 的话 Intel Mac 根本跑不起来——所以默认出 arm64，手动勾 intel 再加 x64；
#   3. 产物是 DMG（App + /Applications 快捷方式），打包前做 ad-hoc 签名并校验架构。
#
# 发布：tag 推送（v*）时会把 macOS 产物挂到 Release；
#       build.yml 负责 Windows / Linux / iOS，两边不会互相覆盖（文件名不同）。
run-name: macOS · ${{ github.event.head_commit.message || github.ref_name }}

on:
  # 不要直接监听分支 push：每个 push 都会触发 Build，Build 里的 gate 决定
  # 是否全平台；Build 跑完后由下面的 workflow_run 接上 macOS。这样普通 push
  # 只会出 macOS，版本提交/tag/手动触发则会全平台 + macOS。
  #
  # 为什么必须用 workflow_run 而不是 push: tags：
  #   Release 是 build.yml 用 GITHUB_TOKEN 建的 tag，而 GitHub 规定
  #   「GITHUB_TOKEN 触发的事件不会再触发别的 workflow」——`push: tags` 根本不会响
  #   （实测：macos.yml 一次都没被触发过）。workflow_run 不受这条限制。
  #
  # 顺序也是对的：workflow_run 在 Build **完全跑完**之后才启动，
  # 所以轮到 macOS 挂包时，Release 一定已经建好了，不会两个 workflow 抢着建。
  workflow_run:
    workflows: ["Build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      publish:
        description: 构建完把产物挂到 Release
        type: boolean
        default: false
      intel:
        description: 顺便构建 Intel (x86_64) 版（macos-13 排队很久，默认不跑）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  # 必须和 build.yml 里的 FLUTTER_VERSION 保持一致：版本不同缓存对不上，产物也难复现
  FLUTTER_VERSION: 3.47.5

jobs:
  plan:
    name: 计算构建矩阵
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: 生成矩阵
        id: matrix
        env:
          # 只有 workflow_dispatch 才有这个输入；其它触发方式为空
          WANT_INTEL: ${{ inputs.intel }}
        run: |
          arm64='{"name":"Apple Silicon (arm64)","os":"macos-latest","arch":"arm64","asset":"tonicuisc-macos-arm64.dmg","artifact":"tonicuisc-macos-arm64","optional":false}'
          intel='{"name":"Intel (x86_64)","os":"macos-13","arch":"x64","asset":"tonicuisc-macos-x64.dmg","artifact":"tonicuisc-macos-x64","optional":true}'
          if [ "$WANT_INTEL" = "true" ]; then
            echo "include=[$arm64,$intel]" >> "$GITHUB_OUTPUT"
          else
            echo "include=[$arm64]" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: macOS ${{ matrix.name }}
    needs: plan
    # 注意：job 级 if 不能引用 matrix（矩阵还没展开），所以 Intel 是否参与
    # 由上面的 plan job 决定；这里只保留 workflow_run 的成功条件。
    if: >-
      github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Intel 那条腿失败不该拖垮整个流程
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_run 触发时 github.sha 是默认分支的头，要显式取「被触发的那个 Build」的提交
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 本次构建信息
        run: |
          echo "触发方式: ${{ github.event_name }}"
          echo "提交     : ${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "构建号   : ${{ github.event.workflow_run.run_number || github.run_number }}"

      - name: 本地 Dart 自检
        # 几秒钟的事，但能挡住「括号不配平 / import 指到不存在的文件」这类低级错误——
        # 这些错让 flutter build 跑到十几分钟才炸，不如现在就炸。
        # （真正的 flutter analyze / test 在 build.yml 的 analyze job 里，跑在 Linux 上）
        run: |
          python3 tool/check_dart_balance.py
          python3 tool/check_dart_imports.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 确认 runner
        run: |
          echo "runner 架构: $(uname -m)"
          echo "macOS 版本 : $(sw_vers -productVersion)"
          echo "本次目标   : ${{ matrix.arch }}"

      - name: 缓存 CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ matrix.os }}-${{ hashFiles('app/pubspec.yaml') }}
          restore-keys: pods-${{ matrix.os }}-

      - name: 生成 macOS 工程
        working-directory: app
        run: |
          flutter config --enable-macos-desktop
          flutter create --project-name tonicuisc --org com.tonicuisc --platforms=macos .

      - name: 应用原生补丁
        run: bash ./tool/apply_patches.sh

      - name: 检查沙盒权限（少了就连不上后端）
        run: |
          # app 是沙盒里的：没有 network.client，出去的网络请求会被系统直接掐断；
          # 没有 downloads 读写，下载的歌存不进「下载」目录。
          for key in com.apple.security.network.client \
                     com.apple.security.files.downloads.read-write \
                     com.apple.security.files.user-selected.read-write; do
            if grep -q "$key" app/macos/Runner/Release.entitlements; then
              echo "OK   $key"
            else
              echo "缺失 $key —— 补丁没打上？"
              exit 1
            fi
          done

      - name: 写入版本号
        env:
          # workflow_run 触发时提交信息在 event.workflow_run 里；其它触发在 event.head_commit
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message || github.event.head_commit.message }}
        run: |
          # 构建号跟 build.yml 对齐：workflow_run 时用被触发那次 Build 的 run_number，
          # 否则同一个版本在 macOS 和其它平台上会显示成不同的 build
          python tool/apply_version.py "${{ github.ref_name }}" \
            --build=${{ github.event.workflow_run.run_number || github.run_number }}

      - name: 安装依赖
        working-directory: app
        run: flutter pub get

      - name: 构建
        working-directory: app
        run: flutter build macos --release

      - name: 校验产物
        run: |
          APP="app/build/macos/Build/Products/Release/tonicuisc.app"
          BIN="$APP/Contents/MacOS/tonicuisc"
          if [ ! -d "$APP" ]; then echo "没找到 $APP"; exit 1; fi
          archs="$(lipo -archs "$BIN")"
          echo "架构   : $archs"
          echo "体积   : $(du -sh "$APP" | cut -f1)"
          echo "签名   :"
          codesign -dv --verbose=2 "$APP" 2>&1 | sed -n '1,6p' || true

          # 产物名写了哪个架构，里面就必须真的有那个架构
          case "${{ matrix.arch }}" in
            arm64)
              echo "$archs" | grep -q arm64 || { echo "期望 arm64，实际 $archs"; exit 1; } ;;
            x64)
              echo "$archs" | grep -q x86_64 || { echo "期望 x86_64，实际 $archs"; exit 1; } ;;
          esac
          echo "架构校验通过"

      - name: 打包
        run: |
          APP="app/build/macos/Build/Products/Release/tonicuisc.app"

          # 没签名就做 ad-hoc 签名（保留沙盒/网络 entitlements）。
          # 这只是让系统认得出「签名结构完整」，不等于 Apple 公证，Gatekeeper 仍会提示。
          if ! codesign --verify --deep --strict "$APP" 2>/dev/null; then
            echo "未签名，执行 ad-hoc 签名"
            codesign --force --deep --sign - \
              --entitlements app/macos/Runner/Release.entitlements "$APP"
          fi
          codesign --verify --deep --strict "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | sed -n '1,6p'

          # DMG 里放 App + /Applications 快捷方式，用户拖进去就是安装
          bash tool/installer/macos/make_dmg.sh "$APP" "$GITHUB_WORKSPACE/${{ matrix.asset }}" "Tonicuisc"
          hdiutil verify "$GITHUB_WORKSPACE/${{ matrix.asset }}"
          ls -lh "$GITHUB_WORKSPACE/${{ matrix.asset }}"

      - name: 写使用说明
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### 装到 Mac 上

          1. 下载 `tonicuisc-macos-*.dmg`，双击打开；
          2. 把里面的 `tonicuisc` 拖到「应用程序」；
          3. 第一次打开会被 Gatekeeper 拦（未公证）。右键 App → 打开，或执行一次：

          ```bash
          xattr -dr com.apple.quarantine /Applications/tonicuisc.app
          ```

          Intel 机器下 `arm64` 包跑不起来，请选 `x64`。
          EOF

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: 挂到 Release
    needs: build
    # 三种情况要挂：Build 成功后的自动接续、tag 推送、手动勾了 publish
    if: github.event_name == 'workflow_run' || startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist

      - name: 列出产物
        run: find dist -type f | sort

      - name: 计算标签与标题
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          # workflow_run 时提交信息在 event.workflow_run 里
          COMMIT_TITLE: ${{ github.event.workflow_run.head_commit.message || github.event.head_commit.message }}
        run: |
          # 和 build.yml 保持同一套规则：提交标题里的 vX.Y.Z（可带 fix）优先，其次用 tag 名
          title=$(printf '%s' "$COMMIT_TITLE" | head -n 1 | tr -d '\r' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
          tag=$(printf '%s' "$COMMIT_TITLE" | grep -oiE 'v[0-9]+\.[0-9]+(\.[0-9]+)?(fix)?' | head -n 1 | tr 'A-Z' 'a-z')
          [ -n "$tag" ] || tag="$REF_NAME"
          [ -n "$title" ] || title="Tonicuisc $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "Release 标签: $tag 标题: $title"

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ steps.version.outputs.title }}
        run: |
          # 普通 push 的 Build 只跑了 gate + 静态检查，不会建 Release；
          # 这种情况只保留 artifact，别在 Release 列表里建出一个 "main"。
          # 手动跑 macOS 并勾了 publish 时仍然允许新建。
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ inputs.publish }}" != "true" ]; then
              echo "触发本次构建的 Build 没有创建 Release（普通 push），跳过上传。"
              exit 0
            fi
          fi

          # build.yml 的 Release job 可能同时在跑：谁先到谁建，另一个重试即可
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "$TITLE" && break
            elif gh release create "$TAG" --title "$TITLE" --generate-notes; then
              break
            fi
            echo "第 $attempt 次没成，10 秒后重试…"
            sleep 10
          done

          mapfile -d '' assets < <(find dist -type f -print0)
          gh release upload "$TAG" "${assets[@]}" --clobber
