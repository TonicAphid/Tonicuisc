name: Build

# Actions 列表里显示的名字 = 提交标题（手动触发时用分支/tag 名）
run-name: ${{ github.event.head_commit.message || github.ref_name }}

on:
  # 分支 push 也进这个 workflow，但只有「版本提交」或 tag/手动触发才构建；
  # 普通提交只跑一个几秒钟的 gate，什么都不构建，不烧 runner。
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 发布标签（留空则用 app/pubspec.yaml 里的版本号）
        required: false
        default: ""
      intel:
        description: 额外构建 Intel macOS (x64)
        type: boolean
        default: false

permissions:
  contents: read

# 同一个分支上连续推送时，取消上一次还在跑的构建。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 固定 Flutter 版本：flutter-action 的缓存 key 才会稳定，避免每次重新保存缓存
  FLUTTER_VERSION: 3.47.5

jobs:
  gate:
    name: 判断是否完整构建
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.check.outputs.full }}
      macos_include: ${{ steps.check.outputs.macos_include }}
    steps:
      - name: 检查触发条件
        id: check
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_INTEL: ${{ inputs.intel }}
        run: |
          # 只认提交标题**最前面**的 vX.Y.Z / vX.Y.Zfix；
          # 后面跟「修复 xxx」之类的文字完全不影响。
          # 手动触发 / tag 一律全平台。
          full=false
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$REF_TYPE" = "tag" ] || [ -n "$INPUT_TAG" ]; then
            full=true
          elif printf '%s' "$MESSAGE" | head -n 1 | grep -qiE '^[[:space:]]*v[0-9]+\.[0-9]+(\.[0-9]+)?(fix)?'; then
            full=true
          fi

          arm64='{"name":"Apple Silicon (arm64)","os":"macos-latest","arch":"arm64","asset":"tonicuisc-macos-arm64.dmg","artifact":"tonicuisc-macos-arm64","optional":false}'
          intel='{"name":"Intel (x86_64)","os":"macos-13","arch":"x64","asset":"tonicuisc-macos-x64.dmg","artifact":"tonicuisc-macos-x64","optional":true}'
          if [ "$INPUT_INTEL" = "true" ]; then
            macos_include="[$arm64,$intel]"
          else
            macos_include="[$arm64]"
          fi

          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "macos_include=$macos_include" >> "$GITHUB_OUTPUT"
          echo "完整构建: $full"
          echo "macOS 矩阵: $macos_include"

  analyze:
    name: 静态检查
    needs: gate
    if: needs.gate.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 生成工程骨架
        working-directory: app
        run: flutter create --project-name tonicuisc --org com.tonicuisc --platforms=linux .

      - name: 静态检查与单元测试
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

  desktop:
    name: ${{ matrix.name }}
    # 静态检查 + 单元测试先过，再开始烧各平台的构建时间
    # macOS 不在这里：它是同一个 workflow 的 macos job，默认 arm64，勾 intel 才加 x64
    needs: [gate, analyze]
    if: needs.gate.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows
            bundle: build/windows/x64/runner/Release
            artifact: tonicuisc-windows-x64
          - name: Linux x64
            os: ubuntu-latest
            platform: linux
            bundle: build/linux/x64/release/bundle
            artifact: tonicuisc-linux-x64
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Linux 构建依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev libsecret-1-dev libjsoncpp-dev

      - name: 生成平台工程
        working-directory: app
        run: flutter create --project-name tonicuisc --org com.tonicuisc --platforms=${{ matrix.platform }} .

      - name: 应用原生补丁（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/apply_patches.ps1

      - name: 应用原生补丁（Linux）
        if: runner.os != 'Windows'
        run: bash ./tool/apply_patches.sh

      - name: 写入版本号
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # 版本取推送的 tag（有的话）或提交信息里的 vX.Y.Z（可带 fix），写进 version.dart 和 pubspec
          python tool/apply_version.py "${{ github.ref_name }}" --build=${{ github.run_number }}

      - name: 安装依赖
        working-directory: app
        run: flutter pub get

      - name: 构建
        working-directory: app
        run: flutter build ${{ matrix.platform }} --release

      - name: 打包 (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null

          # 免安装 zip 保留一份，方便不想装的人直接用
          Compress-Archive -Path "app/${{ matrix.bundle }}" `
            -DestinationPath "dist/tonicuisc-windows-x64-portable.zip" -Force

          # 版本号用 apply_version 刚写进 pubspec 的 x.y.z（Inno 只认数字三段）
          $pubspec = Get-Content app/pubspec.yaml -Raw
          if ($pubspec -notmatch '(?m)^version:\s*(\d+\.\d+\.\d+)') {
            throw "pubspec.yaml 里找不到合法的 x.y.z 版本号"
          }
          $version = $Matches[1]

          # windows-latest 自带 Inno Setup 6；万一镜像变了就临时装一个
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe" }

          & $iscc `
            "/DAppVersion=$version" `
            "/DSourceDir=$PWD\app\build\windows\x64\runner\Release" `
            "/DOutputDir=$PWD\dist" `
            "tool\installer\windows\tonicuisc.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem dist | Select-Object Name, Length

      - name: 打包 (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          tar -C "app/$(dirname ${{ matrix.bundle }})" -czf dist/tonicuisc-linux-x64.tar.gz "$(basename ${{ matrix.bundle }})"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.name }}
    # 只有 gate 判定为版本提交 / tag / 手动触发时才构建；普通 push 直接跳过。
    needs: [gate, analyze]
    if: needs.gate.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.macos_include) }}
    steps:
      - uses: actions/checkout@v5

      - name: 本次构建信息
        run: |
          echo "触发方式: ${{ github.event_name }}"
          echo "提交     : ${{ github.sha }}"
          echo "构建号   : ${{ github.run_number }}"

      - name: 本地 Dart 自检
        run: |
          python3 tool/check_dart_balance.py
          python3 tool/check_dart_imports.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 确认 runner
        run: |
          echo "runner 架构: $(uname -m)"
          echo "macOS 版本 : $(sw_vers -productVersion)"
          echo "本次目标   : ${{ matrix.arch }}"

      - name: 缓存 CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ matrix.os }}-${{ hashFiles('app/pubspec.yaml') }}
          restore-keys: pods-${{ matrix.os }}-

      - name: 生成 macOS 工程
        working-directory: app
        run: |
          flutter config --enable-macos-desktop
          flutter create --project-name tonicuisc --org com.tonicuisc --platforms=macos .

      - name: 应用原生补丁
        run: bash ./tool/apply_patches.sh

      - name: 检查沙盒权限（少了就连不上后端）
        run: |
          for key in com.apple.security.network.client \
                     com.apple.security.files.downloads.read-write \
                     com.apple.security.files.user-selected.read-write; do
            if grep -q "$key" app/macos/Runner/Release.entitlements; then
              echo "OK   $key"
            else
              echo "缺失 $key —— 补丁没打上？"
              exit 1
            fi
          done

      - name: 写入版本号
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python tool/apply_version.py "${{ github.ref_name }}" --build=${{ github.run_number }}

      - name: 安装依赖
        working-directory: app
        run: flutter pub get

      - name: 构建
        working-directory: app
        run: flutter build macos --release

      - name: 校验产物
        run: |
          APP="app/build/macos/Build/Products/Release/tonicuisc.app"
          BIN="$APP/Contents/MacOS/tonicuisc"
          if [ ! -d "$APP" ]; then echo "没找到 $APP"; exit 1; fi
          archs="$(lipo -archs "$BIN")"
          echo "架构   : $archs"
          echo "体积   : $(du -sh "$APP" | cut -f1)"
          echo "签名   :"
          codesign -dv --verbose=2 "$APP" 2>&1 | sed -n '1,6p' || true

          case "${{ matrix.arch }}" in
            arm64)
              echo "$archs" | grep -q arm64 || { echo "期望 arm64，实际 $archs"; exit 1; } ;;
            x64)
              echo "$archs" | grep -q x86_64 || { echo "期望 x86_64，实际 $archs"; exit 1; } ;;
          esac
          echo "架构校验通过"

      - name: 打包
        run: |
          APP="app/build/macos/Build/Products/Release/tonicuisc.app"

          if ! codesign --verify --deep --strict "$APP" 2>/dev/null; then
            echo "未签名，执行 ad-hoc 签名"
            codesign --force --deep --sign - \
              --entitlements app/macos/Runner/Release.entitlements "$APP"
          fi
          codesign --verify --deep --strict "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | sed -n '1,6p'

          bash tool/installer/macos/make_dmg.sh "$APP" "$GITHUB_WORKSPACE/${{ matrix.asset }}" "Tonicuisc"
          hdiutil verify "$GITHUB_WORKSPACE/${{ matrix.asset }}"
          ls -lh "$GITHUB_WORKSPACE/${{ matrix.asset }}"

      - name: 写使用说明
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### 装到 Mac 上

          1. 下载 `tonicuisc-macos-*.dmg`，双击打开；
          2. 把里面的 `tonicuisc` 拖到「应用程序」；
          3. 第一次打开会被 Gatekeeper 拦（未公证）。右键 App → 打开，或执行一次：

          ```bash
          xattr -dr com.apple.quarantine /Applications/tonicuisc.app
          ```

          Intel 机器下 `arm64` 包跑不起来，请选 `x64`。
          EOF

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  ios:
    name: iOS (未签名)
    needs: [gate, analyze]
    if: needs.gate.outputs.full == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 缓存 CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('app/pubspec.yaml') }}
          restore-keys: pods-${{ runner.os }}-

      - name: 生成 iOS 工程
        working-directory: app
        run: flutter create --project-name tonicuisc --org com.tonicuisc --platforms=ios .

      - name: 应用原生补丁
        run: bash ./tool/apply_patches.sh

      - name: 写入版本号
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python tool/apply_version.py "${{ github.ref_name }}" --build=${{ github.run_number }}

      - name: 安装依赖
        working-directory: app
        run: flutter pub get

      - name: 构建（不签名）
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: 打包为 ipa
        run: |
          mkdir -p Payload
          cp -R app/build/ios/iphoneos/Runner.app Payload/
          zip -qry tonicuisc-ios-unsigned.ipa Payload

      - uses: actions/upload-artifact@v5
        with:
          name: tonicuisc-ios-unsigned
          path: tonicuisc-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: [gate, analyze, desktop, ios, macos]
    # macOS 现在是 Build 里的一个 job，Release 会等它跑完，
    # 所以三个平台（Windows / Linux / macOS）的安装包会一次性上传。
    if: >-
      needs.gate.outputs.full == 'true'
      && (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist

      - name: 计算标签与标题
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
        run: |
          # 提交标题的第一行，作为 Release 标题
          title=$(printf '%s' "$COMMIT_TITLE" | head -n 1 | tr -d '\r' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')

          # 提交标题里的 v0.0.x（可带 fix 后缀，如 v0.0.7fix），必须带 v
          tag=$(printf '%s' "$COMMIT_TITLE" | grep -oiE 'v[0-9]+\.[0-9]+(\.[0-9]+)?(fix)?' | head -n 1 | tr 'A-Z' 'a-z')
          if [ -n "$tag" ]; then
            source="提交标题"
          elif [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"; source="推送的 tag"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"; source="手动输入"
          else
            version=$(grep -E '^version:' app/pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*//' | cut -d+ -f1)
            tag="v${version:-0.0.0}"; source="pubspec 版本号"
          fi

          [ -n "$title" ] || title="Tonicuisc $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "Release 标签: $tag（来源：$source）"
          echo "Release 标题: $title"

      - name: 列出产物
        run: find dist -type f | sort

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ steps.version.outputs.title }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE"
          else
            gh release create "$TAG" --title "$TITLE" --generate-notes
          fi
          mapfile -d '' assets < <(find dist -type f -print0)
          gh release upload "$TAG" "${assets[@]}" --clobber
